domain: writing
candidates:
- id: WRI_CAND_01M56AARPWMTW35H4FJ4QT3AH3
  hypothesis: Acts of telling can function as consequential action rather than exposition
    when a story, testimony, lie, confession, report, rumor, or remembered account changes
    access, trust, hospitality, identity, reputation, grief, information, obligation, or another
    material relationship in the ongoing narrative.
  evidence:
  - WRITING_EV_0054
  owners:
  - PAT_build_plot_from_causal_consequences
  - PAT_stage_disclosure_to_sustain_reader_inference
  - writing_fiction_variant_use_inset_story_as_counterpressure
  - PAT_combine_dialogue_with_action_thought_and_silence
  state: open
- id: WRI_CAND_01M56AARPWXQKA83F2Q5VH76CV
  hypothesis: Absurd, surreal, satirical, and nonsensical writing often remains more legible
    and forceful when the reader can recover an operating reference system—a familiar phrase,
    rule, institution, procedure, or causal frame—that the text literalizes, reverses, overextends,
    or misapplies; once that logic is established, the prose can commit to the premise without
    repeatedly explaining it.
  evidence:
  - WRITING_EV_0051
  - WRITING_EV_0062
  owners:
  - PAT_shape_style_as_response_to_story_situation
  - writing_fiction_variant_anchor_absurdity_in_legible_operating_logic
  state: resolved_into_canon
- id: WRI_CAND_01M56AARPXXTJZS7VAVR0JFRCE
  hypothesis: A convincing character transformation may preserve much of the character's established
    equipment while changing what those capacities, attachments, defects, loyalties, or priorities
    are organized around. The later action should feel newly purposed rather than as if the
    story replaced the character with a different personality at the climax.
  evidence:
  - WRITING_EV_0057
  - WRITING_EV_0059
  owners:
  - PAT_scale_character_change_to_story_length
  - PAT_build_round_characters_from_contradiction_and_desire
  - PAT_reveal_character_incrementally_through_behavior
  state: open
- id: WRI_CAND_01M56AARPX8G3T1GQJC09N2T1Z
  hypothesis: Repetition, escalation, rhetorical inflation, disproportion, or an apparently
    excessive extra beat can be functional when each recurrence increases pressure, changes
    context, sharpens timing, or prepares a stronger payoff. The complementary limit holds
    that once recurrence stops transforming the situation and merely delays the next stronger
    beat, local funniness is no longer sufficient reason to keep it.
  evidence:
  - WRITING_EV_0062
  - WRITING_EV_0064
  - WRITING_EV_0065
  owners:
  - PAT_reinforce_story_structure_through_repetition_and_variation
  - PAT_shape_sentence_rhythm_through_length_structure_and_punctuation
  - PAT_replace_received_language_with_precise_distinctive_phrasing
  state: open
