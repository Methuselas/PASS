- id: ART_MEM_01M5HZJ9YCJ9EJ6YHAQPPBKHG2
  claim: Single-image analytical and pictorial production is demonstrated; work whose success depends
    on temporal structure across frames, prescribed multi-pass information ceilings, or articulated limb-chain
    integrity is not.
  claim_class: reach
  claim_kind: stochastic
  confidence: repeated
  delta:
    kinds:
    - posture
    - verification
    statement: Do not claim demonstrated capability in temporal-sequence, staged-pass, or limb-chain work;
      run an explicit structural check there and treat a plausible result as unverified until it is run.
  envelope:
    holds_in:
    - 'Single-image analytical and pictorial studies: cranial rotation, perspective-field correction,
      tonal planning, changing light and atmosphere, palette derivation, cover testing, product-form ideation'
    not_shown_in:
    - Locomotion and timing structure across frames
    - Prescribed multi-pass construction sequences
    - Human and animal limb-chain integrity
    - Exact cylinder construction
    conditions:
    - A calibration of demonstrated breadth only; it never selects, overrides, or replaces a Canon object
  provenance:
  - training_benchmark
  - user_feedback
  - runtime_self_audit
