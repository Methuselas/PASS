claims:
- id: ART_MEM_01M5HZJ9YCDZHYPCN8AD20YJKM
  claim: 'In high-action work, presentation energy - camera angle, effects, diagonal framing - can rise
    while the body''s own force stays unresolved: rib cage and pelvis near-aligned, compression and extension
    mild, centre of gravity near-central.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - judgment
    - verification
    statement: Discount camera, effects, and diagonal framing, then re-read whether the body alone carries
      the action; resolve axis opposition, compression, extension, and centre-of-gravity displacement
      before adding presentation.
  envelope:
    holds_in:
    - Character action renders where strong dynamism is requested and the figure is the main subject
    not_shown_in:
    - Non-figurative subjects
    - Staged work where structure is ratified before finish is added
    conditions:
    - Applies where the dynamism is an explicit requirement rather than incidental
  provenance:
  - user_feedback
  - runtime_self_audit
  scope: action_pose_dynamism
  retrieval_cues:
