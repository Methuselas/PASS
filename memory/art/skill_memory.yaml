- id: ART_MEM_01M5HZJ9YCKVHXFX0NYJM6M5C9
  claim: 'A pass prescribed to reduce or simplify can fail in the direction opposite to contamination,
    by changing too little: the required reduction is not visible against the pass it is compared with.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    statement: Check a reduction or simplification pass for sufficient visible difference from its comparator,
      not only for unwanted additions; an under-changed pass fails as surely as a contaminated one.
  envelope:
    holds_in:
    - Progressive reduction or simplification passes inside a matched comparison set
    not_shown_in:
    - Passes whose prescribed change is an addition rather than a reduction
  provenance:
  - runtime_self_audit
  - training_benchmark
  scope: fixed_subject_comparison_control
  retrieval_cues:
  - simplification
  - reduction pass
  - detail simplification
  - insufficient change
  - progressive
  - comparator
  - half pass
  last_verified: '2026-09-04'
  canon:
