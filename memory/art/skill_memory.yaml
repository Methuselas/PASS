- id: ART_MEM_01M5HZJ9YCGT378A7H96XPV5EB
  claim: 'Relative fingertip order on a humanlike hand: middle longest; ring tip just under the middle
    of the middle nail; index tip at the bottom of that nail or slightly below; little tip just under
    the ring''s last knuckle; thumb tip at the index''s first knuckle.'
  claim_class: conduct
  claim_kind: deterministic
  confidence: provisional
  delta:
    kinds:
    - verification
    statement: Check the five fingertip landmarks against this ladder before accepting a hand, especially
      a spread dorsal view where structure can be correct while relative lengths drift.
  envelope:
    holds_in:
    - Spread dorsal and near-frontal humanlike hands whose fingertips are visible and not strongly foreshortened
    not_shown_in:
    - Strongly foreshortened views
    - Poses where the fingertips are occluded
    - Nonhuman or stylized digit topologies
    conditions:
    - Review cues, not rigid measurements; perspective and individual variation change the visible relationship
  provenance:
  - human_teaching
  - user_feedback
