- id: ART_MEM_01M5HZJ9YCWQZ6737Y3K9E9DQG
  claim: At rough or silhouette resolution a profile hand carries no drawn nail plane, so thumb side is
    unconstrained and mirrors or disappears; the forearm's rotation is the remaining determinant of which
    side the thumb occupies.
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - action
    - verification
    statement: Before drawing a rough profile hand, state the thumb side from the forearm's rotation -
      a neutral arm carries the thumb forward - then check that side once the hand is drawn.
  envelope:
    holds_in:
    - Rough, silhouette-level hands in profile or neutral-arm presentations
    not_shown_in:
    - Non-profile views
    - Resolved hands where the nail or distal plane is actually drawn
    conditions:
    - Holds where the hand is a secondary element of a composition-first rough rather than the study's
      subject
  provenance:
