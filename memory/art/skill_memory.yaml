- id: ART_MEM_01M5HZJ9YCHVN6TAS9D67DQ3TT
  claim: 'A comparison pass instructed to isolate one subtle cue is vulnerable to non-target channels
    arriving with it: value, colour, and detail can enter a pass meant to vary only overlap and scale.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - application_limit
    statement: After a single-cue isolation pass, check the non-target channels for change before reading
      the comparison; prefer a large explicit variable when the study design permits one.
  envelope:
    holds_in:
    - Matched comparison studies where one subtle perceptual cue must change and the rest of the scene
      must hold
    not_shown_in:
    - Comparisons whose changing variable is a broad change of key, weather, palette, crop, or typographic
      hierarchy
  provenance:
  - runtime_self_audit
  - training_benchmark
  - user_feedback
  scope: fixed_subject_comparison_control
  retrieval_cues:
  - isolate
  - depth cue
