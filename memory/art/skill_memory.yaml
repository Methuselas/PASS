- id: ART_MEM_01M5HZJ9YCP6JY5D46R7352DZY
  claim: A camera change may legitimately move a prop across the frame, but which anatomical hand owns
    it is an invariant rather than a cheatable minor detail; screen side and character-relative side must
    be tracked separately.
  claim_class: conduct
  claim_kind: deterministic
  confidence: provisional
  delta:
    kinds:
    - verification
    - application_limit
    statement: Record prop ownership in character-relative terms before producing a new view, then verify
      the owning hand rather than the screen position after every camera reversal.
  envelope:
    holds_in:
    - Fixed-scene camera sets and sequential views where a character holds or operates a prop
    not_shown_in:
    - More extreme camera moves
    - Multi-prop interactions
    - Props shared between two characters
  provenance:
  - human_teaching
  - user_feedback
