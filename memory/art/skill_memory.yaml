- id: ART_MEM_01M5HZJ9YC1HHZSRBHPXF9Z1TD
  claim: 'A written continuity spine holds broad human scene identity across radical camera change, but
    not nonhuman anatomical identity detail or a dense landmark network: horn orientation, prop placement,
    and distant architecture are redesigned view to view.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - application_limit
    - verification
    statement: For a fantastical subject or a dense landmark network, do not rely on a written continuity
      spine alone; anchor those elements to a visual reference and inspect them view by view.
  envelope:
    holds_in:
    - Fixed-scene camera sets with a human subject and a small number of major landmarks
    not_shown_in:
    - Simpler fantasy scenes
    - Sets anchored to an explicit visual continuity reference
    conditions:
    - The improvement from a declared spine is not deterministic; localized identity errors survive it
  provenance:
  - human_teaching
  - user_feedback
  scope: thumbnail_continuity_under_fantasy_complexity
