- id: GD_MEM_01M5GVS5HKXBDX7RXZG7MADB4P
  claim: Consolidating a mature rules corpus improves novice onboarding as well as veteran retrieval only
    when the advertised core can actually be executed and high-frequency tables sit where they are used;
    reindexing a corpus whose common path still crosses books serves only readers who already know it.
  claim_class: conduct
  claim_kind: stochastic
  confidence: repeated
  delta:
    kinds:
    - verification
    - action
    statement: Before counting a consolidation as an onboarding improvement, run one ordinary procedure
      to a terminal result using only the declared core, and move the tables that procedure needed next
      to it; a better index is not an onboarding repair.
  envelope:
    holds_in:
    - edition transitions that reorganize a large existing rules corpus
    not_shown_in:
    - a newly authored edition transition
    conditions:
    - the corpus is large enough that the common path can cross volumes at all
  provenance:
  - training_benchmark
  - human_teaching
  scope: consolidation_that_serves_both_audiences
  retrieval_cues:
  - executable core
  - advertised core
  - table locality
  - reference locality
  - cross-book dependency
  - consolidation onboarding
  - reindex a corpus
  last_verified: '2026-09-02'
  canon:
  - PAT_keep_common_path_procedures_inside_the_declared_playable_core
  - PAT_design_rules_artifacts_for_learning_and_retrieval
  evidence:
  - GAMEDESIGN_EV_0009
