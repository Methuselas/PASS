- id: GD_MEM_01M5DYG7Y24G41AGXDR1MZR82Y
  claim: 'Substitution breadth in a multi-currency character economy rewards mastery of the option catalog
    itself: grade, mixing, capacity, and capital-versus-advancement exchanges let a player who knows the
    whole catalog assemble the same capability more cheaply than one who knows only the obvious path,
    with no timing advantage involved.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - judgment
    statement: Price a capability along every legal substitution route the catalog allows, not just the
      obvious one, and decide whether rewarding catalog knowledge is a skill this game wants to sell -
      separately from any decision about purchase timing.
  envelope:
    holds_in:
