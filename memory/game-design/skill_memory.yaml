claims:
- id: GD_MEM_01M5GVS5HK1062YH2WAGGA79XA
  claim: 'Campaign continuity can create durable retrospective value beyond a session''s immediate utility:
    players keep and revisit records of their own play, so history earns its cost partly after the sessions
    that produced it.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - judgment
    statement: Count retrospective value when deciding whether continuity detail earns its cost, instead
      of judging every element only by what it changes in the next encounter.
  envelope:
    holds_in:
    - long campaigns whose players record or retell their own history
    not_shown_in:
    - one-shot or short-arc play with no accumulated history
    conditions:
    - it does not establish that all background detail earns its cost
  provenance:
  - human_teaching
  scope: campaign_retrospective_value
  retrieval_cues:
  - campaign journal
  - retrospective value
  - setting history
  - revisited play
  - value after the session
  last_verified: '2026-09-08'
  canon:
  - PAT_spend_worldbuilding_detail_where_it_changes_play
  - PAT_build_stake_weight_through_player_investment_before_threatening_it
  evidence:
  - GAMEDESIGN_EV_0025
- id: GD_MEM_01M5GVS5HK1P7NQ6FGWPQGXPRV
  claim: 'Force visibility is an information-design choice rather than a universal fairness rule: surprise
    reinforcements can be enjoyable while visible force size supports informed commitment, so reveal what
    the encounter''s intended decision needs.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - judgment
    - action
    statement: Name the decision an encounter is meant to test, then reveal exactly the force information
      that decision requires and keep the rest uncertain where surprise is the point.
  envelope:
    holds_in:
    - encounter design across combat, negotiation, and avoidance situations
    not_shown_in:
    - controlled comparison of otherwise identical encounters
  provenance:
  - human_teaching
  scope: force_visibility
  retrieval_cues:
  - reinforcements
  - surprise
  - enemy force size
  - telegraphing
  - informed commitment
  - information design
  last_verified: '2026-09-08'
  canon:
  - PAT_give_high_consequence_risks_a_learnable_information_basis
  - PAT_layer_adventure_information_by_how_players_can_access_it
  evidence:
  - GAMEDESIGN_EV_0021
- id: GD_MEM_01M5GVS5HK2JPHAY46554Y0VAV
  claim: 'Pre-play confidence and stakeholder approval do not predict player-facing adventure success:
    direct play exposes failures in clue recoverability, challenge calibration, map operability, progression,
    and reward accessibility that are invisible during authoring.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - posture
    statement: Hold an adventure's information, challenge, spatial, and reward structures as unvalidated
      until players have interacted with them, however confident the author and reviewers are.
  envelope:
    holds_in:
    - original adventure authoring taken to live play
    not_shown_in:
    - broader controlled adventure playtests
  provenance:
  - human_teaching
  scope: adventure_playtest_validation
  retrieval_cues:
  - adventure playtest
  - author prediction
  - clue usability
  - encounter calibration
  - map operability
  - approval is not validation
  last_verified: '2026-09-08'
  canon:
  - AP_run_an_evidence_driven_playtest_revision_cycle
  - AP_design_a_playable_adventure
  evidence:
  - GAMEDESIGN_EV_0016
- id: GD_MEM_01M5GVS5HK3D4MVFSB8C6FE3N8
  claim: 'Adventure hub construction is the shallowest part of this skill''s demonstrated adventure work:
    competing interests, evolving local consequences, and return-visit state stay thin even where the
    surrounding structure is strong.'
  claim_class: reach
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - posture
    statement: Treat a hub as unfinished until competing interests, evolving consequences, and return-visit
      state are explicit, and claim no more for hub depth than the rest of the structure earns.
  envelope:
    holds_in:
    - original adventure construction with a settlement or base of operations
    not_shown_in:
    - table play of a constructed hub across repeated return visits
    - campaign-scale evolution of a constructed setting across a sequence of adventures
  provenance:
  - training_benchmark
  - user_feedback
  scope: adventure_hub_depth
  retrieval_cues:
  - hub depth
  - town hub
  - competing interests
  - return-visit state
  - shallow hub
  - known weakness
  last_verified: '2026-09-08'
  canon:
  - PAT_build_adventure_hubs_around_the_return_loop
  - PAT_build_playable_settings_as_action_topologies
  evidence:
  - GAMEDESIGN_EV_0015
- id: GD_MEM_01M5GVS5HK6AVGECH89SRFKKD8
  claim: 'Two subsystems can share a resolution procedure while measuring different competence: replacing
    the competence term of a dice pool, a software rating standing in for an attribute, preserves the
    hit-count resolution exactly while changing what the roll is a test of.'
  claim_class: conduct
  claim_kind: deterministic
  confidence: provisional
  delta:
    kinds:
    - verification
    - judgment
    statement: When two subsystems resolve the same way, read what each one's competence term actually
      measures before treating them as one procedure; an unchanged resolution shape is not an unchanged
      test.
  envelope:
    holds_in:
    - pool engines whose resolution combines a competence term with a skill or effort term
    not_shown_in:
    - original system construction from a blank foundation
    conditions:
    - the substituted term feeds the same resolution arithmetic as the term it replaces
  provenance:
  - training_benchmark
  scope: competence_source_vs_resolution
  retrieval_cues:
  - competence source
  - pool substitution
  - what the roll measures
  - software rating
  - same resolution different test
  - programmed action
  last_verified: '2026-09-04'
  canon:
  - PAT_reuse_core_resolution_grammar_before_adding_new_mechanics
  - PAT_choose_a_randomizer_by_the_uncertainty_profile_it_must_produce
  evidence:
  - GAMEDESIGN_EV_0013
- id: GD_MEM_01M5GVS5HK6AW6B2CM3PFHW8DP
  claim: 'Loss of enthusiasm is not evidence that a design is bad: burnout reduces motivation independently
    of quality, so subjective motivation is a separate signal from evidence about the work.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: repeated
  delta:
    kinds:
    - judgment
    statement: When motivation drops, read it as a state of the author rather than a verdict on the design,
      and seek evidence about quality separately before cutting anything.
  envelope:
    holds_in:
    - long composition-based creative projects where enthusiasm declines over time
    not_shown_in:
    - work with an externally imposed completion standard rather than an authored one
  provenance:
  - human_teaching
  scope: design_motivation_signals
  retrieval_cues:
  - burnout
  - motivation loss
  - design quality
  - enthusiasm is not evidence
  - author state
  last_verified: '2026-09-08'
  canon:
  - PAT_define_completion_against_a_living_game_design_document
  evidence:
  - GAMEDESIGN_EV_0028
- id: GD_MEM_01M5GVS5HKCP4S8TEQYB39G70H
  claim: A construction system can offer many legal configuration choices while producing little meaningful
    build differentiation, because a few parent variables determine most downstream capability and the
    optimal choices converge; configuration count is a poor proxy for breadth.
  claim_class: conduct
  claim_kind: deterministic
  confidence: provisional
  delta:
    kinds:
    - verification
    statement: Test a construction system by building two same-class characters or craft and comparing
      how far their roles actually diverge, rather than by counting the legal options.
  envelope:
    holds_in:
    - point- or component-based construction subsystems for characters, vehicles, or craft
    not_shown_in:
    - construction-heavy games beyond the one comparison that produced this
  provenance:
  - training_benchmark
  - user_feedback
  scope: construction_system_breadth
  retrieval_cues:
  - construction system
  - build variety
  - false choice
  - configuration breadth
  - same-class divergence
  - parent variable
  last_verified: '2026-08-30'
  canon:
  - DRILL_reverse_engineer_a_game_through_play
  evidence:
  - GAMEDESIGN_EV_0004
- id: GD_MEM_01M5GVS5HKDH3PAF8ZQ2DKNVPA
  claim: 'Substitution breadth in a multi-currency character economy rewards mastery of the option catalog
    itself: grade, mixing, capacity, and capital-versus-advancement exchanges let a player who knows the
    whole catalog assemble the same capability more cheaply than one who knows only the obvious path,
    with no timing advantage involved.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - judgment
    statement: Price a capability along every legal substitution route the catalog allows, not just the
      obvious one, and decide whether rewarding catalog knowledge is a skill this game wants to sell -
      separately from any decision about purchase timing.
  envelope:
    holds_in:
    - character systems whose capabilities can be assembled through several substitutable grades, components,
      or capacity budgets
    not_shown_in:
    - an original character economy designed and played from scratch
    conditions:
    - exact substitution failures depend on the currencies and the campaign acquisition ecology
  provenance:
  - training_benchmark
  scope: multi_currency_substitution
  retrieval_cues:
  - substitution economics
  - catalog mastery
  - ware grade
  - capacity budget
  - capital versus advancement
  - same capability cheaper route
  last_verified: '2026-09-04'
  canon:
  - PAT_price_character_options_by_mechanical_leverage_and_constraint
  - PAT_attach_persistent_costs_to_capability_gains
  evidence:
  - GAMEDESIGN_EV_0014
- id: GD_MEM_01M5GVS5HKFTAZN181N8CG797D
  claim: Once additional actions are purchasable they become an engine-wide power currency every subsystem
