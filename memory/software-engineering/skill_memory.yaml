- id: SE_MEM_AXTNZ3499FNCZRZC3DGSVQTVZC
  claim: The spread between two projects by the same kind of author exceeds the spread between author
    kinds on two of three metrics, so authorship cannot be read off comment or discard-warning density;
    runtime-check density did separate the sampled groups.
  claim_class: conduct
  claim_kind: deterministic
  confidence: provisional
  delta:
    kinds:
    - judgment
    - posture
    statement: Do not infer who or what wrote a codebase from its comment or discard-warning density;
      where a density does track author kind, treat the separation as unexplained until vintage and size
      are ruled out as its cause.
  envelope:
    holds_in:
    - Assertion density, comment density and discard-warning usage across five C plus plus corpora
    not_shown_in:
    - Languages other than C plus plus
    - Corpora that separate vintage and size from author kind, which is the sample that would decide the
      confound
    conditions:
    - Only two projects of one author kind were available, so the spread claim rests on a small sample
    - A re-measurement over seven corpora put the within-kind spread at 0.79 against a between-kind gap
      of 2.82 on runtime-check density, so those groups do separate on that metric
    - The corpora of one author kind in that sample are also the newest and the smallest, so vintage and
      size are confounded with authorship and none of the three is established as the cause
  provenance:
  - runtime_self_audit
  scope: inferring_authorship_from_code_metrics
  retrieval_cues:
  - density
  - assertion density
  - comment density
  - who wrote this
  - agent-written
  - authorship
  - code signature
  - machine-written
  last_verified: '2026-08-28'
  evidence:
  - SE_EV_0005
