claims:
- id: SE_MEM_8JC9EBP7NFAVV2C9YEE45J76PT
  claim: 'A guidance object''s exception clause narrows a correct rule more often than the rule itself
    is wrong, and misreading it fails in both directions: skipped, it invents defects; over-trusted, it
    excuses them.'
  claim_class: conduct
  claim_kind: stochastic
  confidence: repeated
  delta:
    kinds:
    - judgment
    - verification
    statement: Read the clause that says when a rule does not apply, then verify its terms against this
      code instead of treating it as an exit or as absent.
  envelope:
    holds_in:
    - Reviewing unfamiliar code against prescriptive guidance whose rules carry exception clauses or exemptions
    not_shown_in:
    - Action protocols and practice tasks, whose conditions have not been read this way
    - Guidance read by more than one reviewer, so this is repeated behaviour rather than a cross-reader
      result
    conditions:
    - The clause's terms can be checked against something observable in the code
  provenance:
  - runtime_self_audit
  scope: applying_a_guidance_condition
  retrieval_cues:
  - else clause
  - escape clause
  - rule does not apply
  - exception to the rule
  - when not to use
  - is this an exception
  - this case is different
  - prohibition with an exemption
  - special case
  - guideline
  - best practice
  last_verified: '2026-08-28'
  canon:
  - AP_review_code_you_did_not_write
  evidence:
  - SE_EV_0001
  - SE_EV_0003
