  last_verified: '2026-09-11'
- id: WRI_MEM_002
  scope_type: topic
  scope_id: recurrence_conversion
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained craft lesson: recurrence is strongest when a returning object, ritual, phrase, place, or image changes
    job as well as context. Changing use, ownership, emotional charge, participant, or causal function lets recurrence accumulate
    history instead of merely repeating a signal.'
  confidence: repeated
  status: active
  boundary: Learned independently across multiple complete mentor works in novel, dramatic, epic/epic-derived narrative, and
    now Dickensian historical-fiction form. A Tale of Two Cities adds especially clear evidence that an early device can return
    with a different practical job rather than merely repeat symbolic meaning. Original-writing execution, retention, and
    transfer remain untested.
