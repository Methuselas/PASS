- id: WRI_MEM_021
  scope_type: topic
  scope_id: match_evidence_resolution_to_claim
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained lesson from graded analytical writing: evidence form and granularity should match
    the claim. Structural, logistical, and causal claims can often be supported by precise paraphrase;
    claims about diction, syntax, rhythm, irony, or verbal form usually require exact quotation; broad
    evaluative claims need at least one concrete scene-level detail analyzed at comparable resolution.
    One well-developed example can be stronger than several named examples.'
  confidence: repeated
  status: active
  boundary: Learned across six external reviews with differing evidence needs. The Sherlock Holmes and
    Beowulf reviews independently praised structural analysis while asking for closer quotation when interpretation
    turns on wording, reinforcing that language-level claims need language-level evidence. Transfer to
    longer academic essays and other evidence genres remains untested.
  evidence_count: 6
  evidence_events:
  - WRITING_EV_0020
  - WRITING_EV_0026
  - WRITING_EV_0032
