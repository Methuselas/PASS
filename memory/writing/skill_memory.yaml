  observation: 'Retained craft lesson from the complete Sherlock Holmes collection: fair mystery can conceal
    significance more often than raw fact. Let the viewpoint character and reader honestly perceive materially
    relevant evidence, allow context or an incomplete hypothesis to hide its best relation, and make the
    later solution causally reorganize earlier details. A capable investigator may revise, arrive late,
    fail, or solve only part of a case; fallibility preserves uncertainty without requiring authorial
    cheating.'
