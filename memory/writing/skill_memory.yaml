- id: WRI_MEM_024
  scope_type: topic
  scope_id: predictive_default_revision_gate
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained writing heuristic from direct human teaching and later testing: when a sentence,
    transition, image, paragraph turn, or repeated rhetorical sequence feels like the safest statistically
    obvious continuation, treat that predictability as a revision signal. Ask **Does this sound predictive?**
    first at the local move and then across several adjacent moves. Force a second route by changing a
    governing choice such as syntax, connective logic, sentence function, ordering, emphasis, image, specificity,
    register, directness, tonal angle, paragraph movement, or degree of signposting. Keep the alternative
    only if it is more exact, alive, or characteristic of the piece; surprise by itself is not improvement.'
  confidence: provisional
  status: active
  boundary: Directly taught as a live revision gate for finished prose and followed by two externally
    graded capstones plus a three-detector comparison of the first frozen essay. Sherlock Holmes and Beowulf
    both earned strong A-range evaluations with positive prose-control feedback; Beowulf also avoided
    serial first/second/third scaffolding and made a stronger final turn. Density still recurred, and
    the intervention has not been isolated as the cause. Detector disagreement remains diagnostic curiosity
    only, never authorship truth or a revision target.
