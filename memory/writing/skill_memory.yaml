    should end once that job is complete rather than continue as display.
  claim_class: conduct
  claim_kind: stochastic
  confidence: repeated
  delta:
    kinds:
    - judgment
    - action
    statement: Before changing discourse form, name the narrative or cognitive job that changed, and fix
      the stopping condition that ends the borrowed mode, so the exit is a plan rather than a later judgment.
  envelope:
    holds_in:
    - reading analysis of two complete novels whose form shifts were traced to a changed narrative or
      cognitive job
    not_shown_in:
