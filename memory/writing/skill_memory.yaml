  diagnosis:
    failure_layer: application
    hypothesis: Systems-oriented thinking compresses several abstractions and inferential relations into one local unit. Lowering
      word count can leave the cognitive burden intact, so the relevant variable is conceptual hierarchy and passage-level
      release rather than sentence length alone.
