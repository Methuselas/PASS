- id: WRI_MEM_011
  scope_type: topic
  scope_id: recognition_vs_reform
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained craft lesson: character change should be resolved by domain rather than collapsed into one state.
    Recognition, intention, confession, outward compliance, proposition-level belief, self-policing, changed conduct, emotion,
    attachment, desire, repentance, relapse, environmental support, allegiance, and durable reform can move separately. A
    story should claim only the layers it has actually demonstrated under relevant pressure.'
  confidence: repeated
  status: active
  boundary: Learned independently across three complete mentor novels, including voluntary and coerced forms of change, and
    successfully retrieved in a graded analytical synthesis; original fictional execution, later retention, and cross-form
    transfer remain untested.
