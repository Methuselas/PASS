  observation: 'Self-knowledge from graded work: I have a tendency to restate or interpret an effect after examples, action,
    or comic timing have already established it. During revision I should test whether the final explanatory sentence or beat
    adds a new consequence, contradiction, or distinction; if it only tells the reader what the preceding material already
    made legible, cut or compress it.'
