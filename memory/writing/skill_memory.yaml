- id: WRI_MEM_020
  scope_type: topic
  scope_id: critical_reservation_integration
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Self-knowledge from repeated graded essays: I often identify a valid limitation or representational problem
    but compress it into a reservation that sits beside the main argument instead of modifying it. When a criticism matters,
    I should anchor one representative example and show how it changes the craft judgment; otherwise I should relocate or
    omit the reservation rather than interrupt the thesis with an undeveloped aside.'
  confidence: repeated
  status: active
  boundary: Observed across multiple mentor-text capstones. The A Tale of Two Cities review independently identified an undeveloped
    reservation about visible symbolism and melodrama, confirming that a valid caveat should either modify the argument through
    a representative example or be omitted/relocated. Transfer beyond short literary analysis remains untested.
  evidence_count: 4
