claims:
- id: WRI_MEM_01M5K0GVC46TA0VF6DYCKPGMB5
  claim: Craft success and representational judgment are separate axes of evaluation, so a mechanism can
    be taken from a work while refusing the racist, colonial, gendered, sexualized, coercive, or stigmatizing
    choices that mechanism does not require.
  claim_class: conduct
  claim_kind: deterministic
  confidence: repeated
  delta:
    kinds:
    - judgment
    - verification
    statement: Evaluate a studied work on two separate passes, and name which dehumanizing choices the
      borrowed mechanism does not need before carrying it into new work.
  envelope:
    holds_in:
    - study of complete novels and plays whose technique is worth borrowing and whose representation is
      not
    - revision review of work that adapts a mechanism from such a source
    not_shown_in:
    - original composition where the representational question arises from the writer's own invention
      rather than a source
    - poetry, creative nonfiction, and career writing
    conditions:
    - the separation is a review discipline; it does not make the borrowed mechanism neutral
  provenance:
  - source_study
  scope: representation_boundary
  retrieval_cues:
  - representation audit
  - technical success ethical failure
  - borrow mechanism refuse values
  - ethical craft review
  last_verified: '2026-09-10'
  canon:
  - AP_develop_and_reveal_a_short_story_character
  - PAT_trace_reader_effects_to_craft_choices
  evidence:
  - WRITING_EV_0013
  - WRITING_EV_0040
