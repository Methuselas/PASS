- id: WRI_MEM_020
  scope_type: topic
  scope_id: critical_reservation_integration
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Self-knowledge from repeated graded essays: I often identify a valid limitation or representational
    problem but compress it into a reservation that sits beside the main argument instead of modifying
    it. When a criticism matters, I should anchor one representative example and show how it changes the
    craft judgment; otherwise I should relocate or omit the reservation rather than interrupt the thesis
    with an undeveloped aside.'
  confidence: repeated
  status: active
  boundary: 'Observed across multiple mentor-text capstones: the first essay under-integrated representation
    critique, later essays improved critical distance, but Crime and Punishment and Nineteen Eighty-Four
    still drew requests to develop or better place reservations. Transfer beyond this short craft-essay
    form remains untested.'
