- id: WRI_MEM_022
  scope_type: topic
  scope_id: authorial_style_as_repeated_microchoices
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained craft lesson from human teaching: an individual prose style is built from repeated
    local decisions, not only from high-level technique. Study conjunctions and connective habits, coordination
    versus subordination, sentence openings, clause order, punctuation, cadence, paragraph turns, diction
    and register, repetition, narrative distance, tonal pivots, and tolerated roughness as functional
    choices. Absorb the effects by transforming and combining them across new material rather than copying
