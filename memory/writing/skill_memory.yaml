    claimed inviolable boundary becomes dramatic when it predicts what the character believes they can,
    must, or will do. Later pressure should be capable of confirming, falsifying, complicating, or breaking
    that prediction, and other characters may use the stated theory as evidence when interpreting motive
    or action.'
