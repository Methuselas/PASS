- id: WRI_MEM_024
  scope_type: topic
  scope_id: predictive_default_revision_gate
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained writing heuristic from direct human teaching and later testing: when a sentence, transition, image,
    paragraph turn, or repeated rhetorical sequence feels like the safest statistically obvious generic continuation, treat
    that predictability as a revision signal. Ask **Does this sound predictive?** locally and across adjacent moves, then
    ask why it is foreseeable. Force a second route when the pattern is generic default prose; preserve recurrence that is
    earned by voice, rhetorical maturity, task, rhythm, ritual, motif, or established world grammar. Change a governing choice
    rather than merely swapping synonyms, and keep the alternative only when it is more exact, alive, or characteristic of
    the piece. Reject the generic continuation, not the inevitable voice.'
  confidence: repeated
  status: active
  boundary: Directly taught as a live revision gate and tested across graded capstones, Alice, and a complete humor anthology.
    The humor study adds strong evidence that recurrence, obvious form, or excess may be intentionally predictable because
    the audience is waiting for transformation, callback, escalation, or timing. Density still recurs, and the intervention
