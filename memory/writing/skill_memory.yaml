    returns during revision once control resumes, even when removing them would sharpen the whole piece.
  claim_class: conduct
  claim_kind: stochastic
  confidence: provisional
  delta:
    kinds:
    - verification
    - judgment
    statement: Compare each passage against the strongest remaining line of escalation, rhythm, or effect,
      and run that deletion test again during revision rather than treating the first-draft pass as sufficient.
  envelope:
    holds_in:
    - the verbal middle of one original comic short story, where two independent readers found the same
      excess
    - a revised and externally evaluated analytical essay whose locally effective framing was retained
      into self-restatement at the close
    not_shown_in:
    - poetry, career writing, and any second original story
    conditions:
    - the two instances are unlike - a comic scene and an analytical framing - so the cross-form generalization
      remains thin
  provenance:
