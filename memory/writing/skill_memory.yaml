- id: WRI_MEM_014
  scope_type: topic
  scope_id: sentence_density_and_clause_load
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Persistent self-knowledge from repeated graded essays: my density problem is not reducible to long sentence
    length. Even when prose is praised as controlled and rhetorically skilled, I can compress too many abstractions, inferential
    steps, causal relations, or rhetorical jobs into a small space. The corrective is conceptual hierarchy plus rhythmic release:
    identify the dominant move, externalize hidden bridges, concretize where possible, and use short declarative sentences
    when they give the reader orientation or recovery without flattening the thought.'
  confidence: repeated
  status: active
  boundary: Observed across nine short mentor-text capstone/evaluation cycles in related literary-analysis forms. Sherlock
    Holmes, Beowulf, the professional Alice rewrite, and A Tale of Two Cities all received strong overall prose evaluations
    while still drawing attention to dense multi-clause movement, reinforcing that the problem is conceptual and rhythmic
    load rather than sentence length alone. Transfer to fiction, longer essays, and later sessions remains untested.
  evidence_count: 9
  evidence_events:
  - WRITING_EV_0014
  - WRITING_EV_0020
  - WRITING_EV_0026
  - WRITING_EV_0032
  - WRITING_EV_0042
