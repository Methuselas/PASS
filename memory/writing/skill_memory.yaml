  scope_id: mechanics_to_metaphor
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained craft lesson: literal procedures, tools, bodies, and physical constraints can
    carry thematic meaning before commentary does. When concrete mechanics already make an abstraction
    experienceable, explanation should add a new consequence or layer rather than merely decode what the
    action has shown.'
  confidence: provisional
  status: active
  boundary: Learned in reading analysis; execution in original writing, retention, and transfer remain
    untested.
