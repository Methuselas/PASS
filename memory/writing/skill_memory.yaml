- id: WRI_MEM_001
  scope_type: topic
  scope_id: mechanics_to_metaphor
  type: learned_principle
  evidence_class: stochastic_performance
  observation: 'Retained craft lesson: literal procedures, tools, bodies, and physical constraints can carry thematic meaning
    before commentary does. When concrete mechanics already make an abstraction experienceable, explanation should add a new
    consequence or layer rather than merely decode what the action has shown.'
  confidence: repeated
  status: active
  boundary: Now independently supported by multiple mentor works, including The Odyssey, where the scar, bow, rooted marriage
    bed, and orchard trees perform literal evidentiary or causal work before carrying larger meaning. Original-writing execution,
    retention, and transfer remain untested.
  evidence_count: 2
  evidence_events:
  - WRITING_EV_0007
  - WRITING_EV_0054
  evidence_origin:
  - book_close_training
  likely_owners:
